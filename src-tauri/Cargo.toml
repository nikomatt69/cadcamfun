[package]
name = "cadcamfun-desktop"
version = "1.1.0"
description = "CAD/CAM FUN - Professional CAD/CAM Software"
authors = ["CAD/CAM FUN Team"]
edition = "2021"

# Remove the [lib] section and replace with [bin] for Tauri applications
[[bin]]
name = "cadcamfun-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
# Core Tauri dependencies
tauri = { version = "2.0", features = [
  "devtools",
  "tray-icon"
] }

# Tauri plugins
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"
tauri-plugin-http = "2.0"
tauri-plugin-notification = "2.0"
tauri-plugin-os = "2.0"
tauri-plugin-process = "2.0"
tauri-plugin-shell = "2.0"
tauri-plugin-updater = "2.0"
tauri-plugin-clipboard-manager = "2.0"
tauri-plugin-global-shortcut = "2.0"
tauri-plugin-store = "2.0"
tauri-plugin-window-state = "2.0"
tauri-plugin-single-instance = "2.0"
tauri-plugin-log = "2.0"
tauri-plugin-sql = { version = "2.0", features = ["postgres"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# HTTP client for API communication
reqwest = { version = "0.12", features = ["json", "stream"] }

# Database connectivity (SQLite for local storage)
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "sqlite", "migrate", "chrono", "uuid"] }

# Date and time handling
chrono = { version = "0.4", features = ["serde"] }

# UUID generation
uuid = { version = "1.0", features = ["v4", "serde"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Config management
config = "0.14"

# File system utilities
directories = "5.0"

# JWT handling for authentication
jsonwebtoken = "9.0"

# Password hashing
argon2 = "0.5"

# Cross-platform system information
sysinfo = "0.30"

# Process management for sidecar server
subprocess = "0.2"

# Network utilities
local-ip-address = "0.6"

# Archive handling for exports
zip = "2.1"

# Image processing for thumbnails
image = "0.25"

# Process detection
which = "6.0"

# Configuration handling
toml = "0.8"

# Additional utilities
regex = "1.0"
sha2 = "0.10"
flate2 = "1.0"

# Auto-updater dependencies
semver = "1.0"
hex = "0.4"
futures-util = "0.3"

[features]
# This feature is used for production builds or when a dev server is not specified
custom-protocol = ["tauri/custom-protocol"]
default = ["custom-protocol"]

# Development features
dev = ["tauri/devtools"]

# Production optimizations
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
