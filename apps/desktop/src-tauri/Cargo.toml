[package]
name = "cadcamfun-desktop"
version = "0.1.40"
description = "CADCAM FUN desktop shell"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
name = "cadcamfun_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[test]]
name = "native_menu"
# A native menu can only be built on the main thread, which the default harness never runs tests on.
harness = false

[features]
default = ["liquid-glass"]
# The window material uses private Apple API (see specs/07-tauri-shell.md): a build for the Mac App Store turns this off
# (`--no-default-features`, with `--config src-tauri/tauri.appstore.conf.json`, which also drops the transparent window).
liquid-glass = ["dep:tauri-plugin-liquid-glass"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `macos-private-api` must be declared here (tauri-build reads the dependency line, not the resolved features); it only takes
# effect when `macOSPrivateApi` is true in the config, which the App Store config turns off.
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-prevent-default = "=6.0.1"
tempfile = "3"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = { version = "0.3", features = ["std"] }
log = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time", "macros", "rt", "net", "io-util"] }
tauri-plugin-log = "2"
# The feed serves raw NSIS/MSI/DEB/RPM installers; macOS tar.gz support is unconditional.
# Avoid the optional legacy ZIP extractor and its vulnerable zip 4 dependency.
tauri-plugin-updater = { version = "2.13.1", default-features = false, features = ["rustls-tls", "system-proxy"] }
tauri-plugin-os = "2"
tauri-plugin-notification = "2"
# macOS 26 Liquid Glass (NSGlassEffectView) with a vibrancy fallback on older macOS; a no-op on Windows and Linux.
tauri-plugin-liquid-glass = { version = "0.1", optional = true }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
# Remembers the size, position and maximised state of the windows between runs.
tauri-plugin-window-state = "2"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }
# `NSProcessInfo.performActivity(options:reason:using:)` keeps App Nap away from a hidden window while a CAM job runs (power.rs). The
# block form is a safe API, so the shell stays free of `unsafe`. Both crates are already in the tree through tauri/wry/notify-rust.
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSProcessInfo", "NSString"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["sync-secret-service"] }

# Policy, reported by `cargo clippy --locked --all-targets --all-features` (CI, src-tauri job). The shell has no `unsafe`
# and no `.unwrap()`: the release profile aborts on panic, so one stray unwrap would take the whole app and the sidecar down.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.dev]
# Line tables are enough for backtraces and panic locations; full DWARF is most of the 12 GB `target/debug` measured on 2026-10-25.
debug = "line-tables-only"

[profile.dev.package."*"]
# Dependencies (tauri, wry, tokio, the keyring) do not change between edits: optimise them once so `tauri dev` and the tests run fast.
opt-level = 2

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[dev-dependencies]
# The mock runtime builds the real menu and runs its handler without a window (menu.rs tests).
tauri = { version = "2", features = ["test", "tray-icon", "macos-private-api"] }
tokio = { version = "1", features = ["sync", "time", "macros", "rt", "net", "io-util", "test-util"] }
