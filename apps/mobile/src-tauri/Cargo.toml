[package]
name = "cadcamfun-mobile"
version = "6.0.0"
description = "CADCAM FUN companion (iOS)"
edition = "2021"
rust-version = "1.77"
publish = false

[lib]
name = "cadcamfun_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
cadcamfun-companion-net = { path = "../native" }

# QR scanning of the pairing code (official plugin, mobile only).
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"

# The pairing token lives in the iOS Keychain, never in web storage.
[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
