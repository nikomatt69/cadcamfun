[package]
name = "cadcamfun-companion-net"
version = "6.0.0"
description = "Certificate-pinned HTTPS client for the CADCAMFUN companion app"
edition = "2021"
rust-version = "1.77"
publish = false

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-manual-roots", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
sha2 = "0.10"
futures-util = "0.3"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rcgen = "0.13"
