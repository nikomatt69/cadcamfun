name: publish
run-name: "${{ format('release {0}', inputs.version || inputs.bump) }}"

# Reusable metadata preparation. ci-pipeline.yml owns the release job sequence.
# This job stamps the version and pushes its tag; it never creates a GitHub release.

on:
  workflow_call:
    inputs:
      bump:
        description: "Bump type: major, minor or patch"
        required: false
        type: string
      version:
        description: "An explicit version, which wins over the bump"
        required: false
        type: string
      prevalidated:
        description: "The caller already ran the workspace validation"
        required: false
        type: boolean
        default: false
    outputs:
      tag:
        description: "The release tag, e.g. v6.0.1"
        value: ${{ jobs.publish.outputs.tag }}
      version:
        description: "The released version, e.g. 6.0.1"
        value: ${{ jobs.publish.outputs.version }}

concurrency:
  group: cadcamfun-publish
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  publish:
    name: prepare the release
    runs-on: ubuntu-latest
    if: github.repository == 'nikomatt69/cadcamfun'
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: git fetch --force --tags

      # The release commit needs an author: the runner image has no git identity.
      - uses: ./.github/actions/setup-git-committer

      - uses: ./.github/actions/setup-bun
        with:
          # The validation step below installs the workspace with the frozen lockfile.
          install: "false"

      - name: Setup actionlint
        uses: ./.github/actions/setup-actionlint

      - name: Validate release workflows
        run: bun --no-env-file scripts/lint-workflows.ts

      - name: Validate the workspace
        if: ${{ !inputs.prevalidated }}
        run: |
          bun --no-env-file install --frozen-lockfile
          bun --no-env-file packages/web/script/generate-api-reference.mjs
          bun --no-env-file run typecheck

      - name: Prepare the release
        id: release
        run: bun --no-env-file scripts/release-publish.ts --phase=start --bump="$CADCAM_BUMP" --version="$CADCAM_VERSION"
        env:
          CADCAM_BUMP: ${{ inputs.bump }}
          CADCAM_VERSION: ${{ inputs.version }}
          GH_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
