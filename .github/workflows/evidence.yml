name: Evidence

# Spec 72 step 0.1 (P0-7): the corpus, the bench and the parity scorecard run every night, not only when someone remembers.
# The corpus run fails the job when a corpus entry is wrong; the bench run fails when its artifact is not comparable or a case
# regressed against the previous night. Reports are kept as artifacts so a night's numbers can be read afterwards.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evidence:
    name: corpus, bench, scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Cache Bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # A partial corpus run overwrites data/corpus-report.json and would lower the scorecard: always the full run.
      - name: Corpus
        run: bun run corpus

      - name: Bench
        run: bun run bench

      - name: Scorecard
        run: bun run scorecard

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ github.run_id }}
          path: |
            data/corpus-report.json
            data/bench.json
            specs/assets/parity-scorecard.md
          if-no-files-found: warn
          retention-days: 30
