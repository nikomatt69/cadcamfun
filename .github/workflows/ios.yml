name: iOS

# Generates the Xcode project and builds the companion for the iOS simulator on a macOS runner (no signing needed).
# Device builds and TestFlight need the owner's Apple developer team and certificates, which are not configured here.
on:
  push:
    branches: ["claude/**", "main"]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator-build:
    name: Xcode project + simulator build
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate the Xcode project
        working-directory: apps/mobile
        run: bunx expo prebuild --platform ios --no-install

      - name: Build for the iOS simulator
        working-directory: apps/mobile
        run: |
          pod install --project-directory=ios
          xcodebuild -workspace ios/CADCAMFUN.xcworkspace -scheme CADCAMFUN -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/cadcamfun-ios" CODE_SIGNING_ALLOWED=NO build
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"

      # Runs the app end to end, not just compiles it. The runner hosts a real sidecar with the companion gateway on; the
      # simulator shares the Mac's network, so the app pairs with it over pinned TLS, and the job then asserts, from the
      # desktop side, that this device authenticated and listed the projects. The app process must also still be alive.
      - name: Pair the simulator app with a desktop and check the round trip
        run: |
          set -euo pipefail
          export CADCAMFUN_TOKEN=ci-sidecar-token CADCAMFUN_DATA_DIR="$RUNNER_TEMP/cadcamfun-data" CADCAMFUN_MIGRATIONS_DIR="$PWD/packages/db/drizzle" CADCAMFUN_AI_OFFLINE=1
          mkdir -p "$CADCAMFUN_DATA_DIR" simulator-out
          # The sidecar exits when its stdin closes (the Tauri shell's lifeline), so keep a pipe open.
          (tail -f /dev/null | bun apps/sidecar/src/main.ts > simulator-out/sidecar.out 2> simulator-out/sidecar.err) &
          for _ in $(seq 1 60); do grep -q '"event":"ready"' simulator-out/sidecar.out 2>/dev/null && break; sleep 1; done
          PORT=$(python3 -c 'import json; print(json.loads(open("simulator-out/sidecar.out").readline())["port"])')
          echo "sidecar on $PORT"
          api() { curl -fsS -H "authorization: Bearer $CADCAMFUN_TOKEN" -H 'content-type: application/json' "$@"; }
          api -X POST "http://127.0.0.1:$PORT/api/companion/enable" -d '{"port":18443}' > /dev/null
          api -X POST "http://127.0.0.1:$PORT/api/projects" -d '{"name":"CI bracket"}' > /dev/null
          LINK=$(api -X POST "http://127.0.0.1:$PORT/api/companion/pair" -d '{"name":"CI simulator","host":"127.0.0.1"}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["link"])')

          APP="$RUNNER_TEMP/cadcamfun-ios/Build/Products/Release-iphonesimulator/CADCAMFUN.app"
          echo "app bundle: $APP"
          test -n "$APP"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for rt in sorted(d, reverse=True) if "iOS" in rt for x in d[rt] if "iPhone" in x["name"]))')
          echo "simulator: $UDID, bundle: $BUNDLE_ID"
          # iOS 26 shows "Open in CADCAMFUN?" for simctl openurl until LaunchServices has approved the
          # scheme. It reads that plist only at boot, so the approval has to be on disk while the device
          # is shut down. A never-booted simulator has no Preferences directory until the first boot.
          device_state() {
            xcrun simctl list devices -j | UDID="$UDID" python3 -c 'import json,os,sys; u=os.environ["UDID"]; devices=json.load(sys.stdin)["devices"]; print(next(x["state"] for group in devices.values() for x in group if x.get("udid")==u))'
          }
          ensure_shutdown() {
            for _ in $(seq 1 90); do
              STATE=$(device_state)
              echo "simulator state: $STATE"
              case "$STATE" in
                Shutdown) return 0 ;;
                Booted) xcrun simctl shutdown "$UDID" || true ;;
              esac
              sleep 2
            done
            echo "simulator did not shut down" >&2
            return 1
          }
          PREFS="$HOME/Library/Developer/CoreSimulator/Devices/$UDID/data/Library/Preferences"
          if [ ! -d "$PREFS" ]; then
            echo "booting once so the simulator data directory exists"
            xcrun simctl boot "$UDID"
            xcrun simctl bootstatus "$UDID" -b
            ensure_shutdown
          else
            ensure_shutdown
          fi
          UDID="$UDID" BUNDLE_ID="$BUNDLE_ID" python3 - <<'PY'
          import os, plistlib, sys
          udid = os.environ["UDID"]
          bundle = os.environ["BUNDLE_ID"]
          device = os.path.expanduser(f"~/Library/Developer/CoreSimulator/Devices/{udid}")
          if not os.path.isdir(device):
              sys.exit(f"simulator device directory missing: {device}")
          path = os.path.join(device, "data/Library/Preferences/com.apple.launchservices.schemeapproval.plist")
          os.makedirs(os.path.dirname(path), exist_ok=True)
          data = {}
          if os.path.exists(path):
              with open(path, "rb") as handle:
                  data = plistlib.load(handle)
          data["com.apple.CoreSimulator.CoreSimulatorBridge-->cadcamfun"] = bundle
          with open(path, "wb") as handle:
              plistlib.dump(data, handle, fmt=plistlib.FMT_BINARY)
          print(f"approved cadcamfun -> {bundle}")
          PY
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          # Best effort: the service name is absent on older simctl builds.
          xcrun simctl privacy "$UDID" grant local-network "$BUNDLE_ID" || true
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" "$BUNDLE_ID"
          # The native process starts before the release bundle subscribes to linking events.
          for _ in $(seq 1 30); do
            READY=$(xcrun simctl spawn "$UDID" launchctl list | grep "UIKitApplication:$BUNDLE_ID" | awk '{print $1; exit}' || true)
            [ -n "${READY:-}" ] && [ "$READY" != "-" ] && break
            sleep 1
          done
          sleep 8
          xcrun simctl openurl "$UDID" "$LINK"

          # The desktop's view: the device token was accepted (lastSeen is set only after a pinned-TLS request authenticated).
          SEEN=""
          for attempt in $(seq 1 45); do
            # A link opened before the router is listening is dropped. Send it again, still without tapping a dialog.
            if [ "$attempt" = "10" ] || [ "$attempt" = "25" ]; then xcrun simctl openurl "$UDID" "$LINK" || true; fi
            SEEN=$(api "http://127.0.0.1:$PORT/api/companion" | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print((d[0]["lastSeen"] or "") if d else "")')
            [ -n "$SEEN" ] && break
            sleep 2
          done
          echo "device last seen: ${SEEN:-never}"
          LISTED=""
          for _ in $(seq 1 20); do
            # Only a GET counts: the script's own POST to create the project logs the same URL.
            if grep -B1 '"http.url": "/api/projects"' simulator-out/sidecar.err | grep -q '"http.method": "GET"'; then LISTED=yes; break; fi
            sleep 2
          done
          echo "projects listed by the app: ${LISTED:-no}"
          xcrun simctl io "$UDID" screenshot simulator-out/companion.png
          PID=$(xcrun simctl spawn "$UDID" launchctl list | grep "UIKitApplication:$BUNDLE_ID" | awk '{print $1}')
          echo "app pid: ${PID:-none}"
          tail -n 30 simulator-out/sidecar.err || true
          test -n "$SEEN"
          test -n "$LISTED"
          test -n "$PID" && [ "$PID" != "-" ]

      - name: Upload the simulator screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-screenshot
          path: simulator-out
          if-no-files-found: warn

      - name: Upload the generated Xcode project
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcode-project
          path: apps/mobile/ios
          if-no-files-found: warn
