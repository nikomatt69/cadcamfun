name: iOS

# Generates the Xcode project and builds the companion for the iOS simulator on a macOS runner (no signing needed).
# Device builds and TestFlight need the owner's Apple developer team and certificates, which are not configured here.
on:
  push:
    branches: ["claude/**", "main"]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator-build:
    name: Xcode project + simulator build
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/mobile/src-tauri/target
          key: cargo-ios-${{ runner.os }}-${{ hashFiles('apps/mobile/src-tauri/Cargo.toml', 'apps/mobile/native/Cargo.toml') }}
          restore-keys: cargo-ios-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate the Xcode project
        working-directory: apps/mobile
        run: bunx tauri ios init --ci

      - name: Build for the iOS simulator
        working-directory: apps/mobile
        run: bunx tauri ios build --debug --target aarch64-sim --ci

      # Runs the app, not just compiles it: boots an iPhone simulator, installs and launches the build, and fails if the
      # process is not alive after a while (a crash on start leaves no running process). The screenshot is an artifact.
      - name: Launch in the iOS simulator
        run: |
          set -euo pipefail
          APP=$(find apps/mobile/src-tauri/gen/apple ~/Library/Developer/Xcode/DerivedData -type d -name "*.app" -path "*sim*" 2>/dev/null | head -n 1)
          if [ -z "$APP" ]; then APP=$(find apps/mobile/src-tauri/gen/apple ~/Library/Developer/Xcode/DerivedData -type d -name "*.app" 2>/dev/null | grep -i -E "iphonesimulator|sim" | head -n 1); fi
          echo "app bundle: $APP"
          test -n "$APP"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          echo "bundle id: $BUNDLE_ID"
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for rt in sorted(d, reverse=True) if "iOS" in rt for x in d[rt] if "iPhone" in x["name"]))')
          echo "simulator: $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" "$BUNDLE_ID"
          sleep 20
          mkdir -p simulator-out
          xcrun simctl io "$UDID" screenshot simulator-out/companion.png
          xcrun simctl spawn "$UDID" launchctl list | tee simulator-out/launchctl.txt | grep "$BUNDLE_ID"
          # A running app has a numeric PID in the first column; "-" means it exited.
          PID=$(xcrun simctl spawn "$UDID" launchctl list | grep "UIKitApplication:$BUNDLE_ID" | awk '{print $1}')
          echo "pid: $PID"
          test -n "$PID" && [ "$PID" != "-" ]

      - name: Upload the simulator screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-screenshot
          path: simulator-out
          if-no-files-found: warn

      - name: Upload the generated Xcode project
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcode-project
          path: apps/mobile/src-tauri/gen/apple
          if-no-files-found: warn
