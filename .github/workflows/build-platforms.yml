name: Build all desktop platforms

on:
  workflow_dispatch:
  push:
    branches: ["build/**"]

permissions:
  contents: read

jobs:
  # Cross-compile every sidecar variant on Linux (no Rust/Tauri).
  build-sidecars:
    name: sidecar (bun) ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin }
          - { target: x86_64-apple-darwin }
          - { target: x86_64-pc-windows-msvc }
          - { target: aarch64-pc-windows-msvc }
          - { target: x86_64-unknown-linux-gnu }
          - { target: aarch64-unknown-linux-gnu }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
        with:
          install: "false"
      - name: Cross-compile the sidecar (Bun)
        run: bun --no-env-file scripts/build.ts --only=install,compile --target=${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: sidecar-${{ matrix.target }}
          path: apps/desktop/src-tauri/binaries/sidecar-${{ matrix.target }}*
          if-no-files-found: error

  # Native runners place the prebuilt sidecar and
  # bundle with Rust + Tauri CLI only (`--skip=check,compile`).
  build:
    needs: build-sidecars
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            bundles: dmg
          - os: macos-14
            target: x86_64-apple-darwin
            bundles: dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            bundles: msi,nsis
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb,rpm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Free Linux runner disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/.ghcup || true
          df -h /
      - uses: ./.github/actions/setup-bun
        with:
          install: "false"
      - uses: actions/download-artifact@v4
        with:
          name: sidecar-${{ matrix.target }}
          path: sidecar-incoming
      - name: Place the prebuilt sidecar (built by Bun, not recompiled here)
        shell: bash
        run: |
          set -euo pipefail
          ext=""
          case "${{ matrix.target }}" in *windows*) ext=".exe" ;; esac
          src="$(find sidecar-incoming -type f -name "sidecar-${{ matrix.target }}${ext}" | head -1)"
          if [ -z "$src" ]; then echo "sidecar artifact for ${{ matrix.target }} is missing" >&2; exit 1; fi
          mkdir -p apps/desktop/src-tauri/binaries
          cp "$src" "apps/desktop/src-tauri/binaries/sidecar-${{ matrix.target }}${ext}"
          if [ -z "$ext" ]; then chmod +x "apps/desktop/src-tauri/binaries/sidecar-${{ matrix.target }}"; fi
          ls -l apps/desktop/src-tauri/binaries/
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: ${{ matrix.target }}
      - name: Install Linux bundler dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev build-essential file rpm
      - name: Build and index installers (Tauri)
        run: bun --no-env-file scripts/build.ts --skip=check,compile --no-updater --target=${{ matrix.target }} --bundles=${{ matrix.bundles }} --out-dir=release
      - uses: actions/upload-artifact@v4
        with:
          name: cadcamfun-${{ matrix.target }}
          path: release/
          if-no-files-found: error
