name: CI

on:
  workflow_call:
  push:
    branches-ignore: [main]
  workflow_dispatch:

# No secret-bearing job runs here, so a fork's pull request executes exactly the
# same jobs as a branch build: every step only reads the checked-out sources.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  workspace:
    name: install, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Cache Bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Cache Rust build (sccache)
        uses: actions/cache@v4
        with:
          path: ~/.cache/sccache
          key: sccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: sccache-${{ runner.os }}-

      - name: Cache Tauri CLI
        id: tauri-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/tauri
          key: tauri-cli-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: tauri-cli-${{ runner.os }}-

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            build-essential \
            curl \
            file \
            wget

      - name: Cache cargo sccache
        uses: taiki-e/install-action@v2
        with:
          tool: sccache@0.10.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: |
          bun --no-env-file packages/web/script/generate-api-reference.mjs
          bun --no-env-file run typecheck

      - name: Setup actionlint
        uses: ./.github/actions/setup-actionlint

      - name: Validate workflows
        run: bun --no-env-file scripts/lint-workflows.ts

      - name: Verify release automation
        run: bun --no-env-file test scripts


      - name: Stage the sidecar binary and the migrations resource
        run: |
          # Steps 3 and 4 of scripts/build.ts, without the bundle: the Rust job
          # below needs binaries/sidecar-<triple> on disk for `tauri::generate_context!`
          # and the shell expects resources/migrations at runtime.
          bun scripts/build.ts --only=compile,resources --target=x86_64-unknown-linux-gnu

  src-tauri:
    name: src-tauri (clippy, test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Cache Bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Cache Rust build (sccache)
        uses: actions/cache@v4
        with:
          path: ~/.cache/sccache
          key: sccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: sccache-${{ runner.os }}-

      - name: Cache Tauri CLI
        id: tauri-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/tauri
          key: tauri-cli-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: tauri-cli-${{ runner.os }}-

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            build-essential \
            curl \
            file \
            wget

      - name: Cache cargo sccache
        uses: taiki-e/install-action@v2
        with:
          tool: sccache@0.10.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Stage the sidecar binary and the migrations resource
        run: |
          bun scripts/build.ts --only=compile,resources --target=x86_64-unknown-linux-gnu

      - name: cargo fmt
        id: format
        continue-on-error: true
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --all -- --check

      - name: cargo clippy
        id: clippy
        continue-on-error: true
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --locked --all-targets --all-features

      - name: Report Rust diagnostics
        if: always() && (steps.format.outcome == 'failure' || steps.clippy.outcome == 'failure')
        run: |
          echo "::warning::Rust formatting or Clippy reported issues; review the diagnostic steps. Native compilation and tests remain required."

      - name: cargo test
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked --all-features

  # Supply-chain reports are advisory (owner request, spec 10 section 2 and spec 56 section 3 G).
  # Findings stay visible as warnings; native compilation and tests are checked separately.
  cargo-deny:
    name: cargo-deny (licences, bans, advisories, sources)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          # RustSec advisories use CVSS 4.0; older parsers abort before checking the lockfile.
          tool: cargo-deny@0.18.6

      - name: cargo deny check
        id: deny
        continue-on-error: true
        working-directory: apps/desktop/src-tauri
        run: cargo deny --locked check

      - name: Report cargo-deny findings
        if: steps.deny.outcome == 'failure'
        run: |
          echo "::warning::cargo-deny reported policy findings or a scanner error; review the cargo deny check logs."

  cargo-audit:
    name: cargo-audit (RustSec advisories)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          # Keep a CVSS 4.0-capable RustSec parser, matching the cargo-deny gate above.
          tool: cargo-audit@0.22.2

      - name: cargo audit
        id: audit
        continue-on-error: true
        working-directory: apps/desktop/src-tauri
        run: cargo audit --file Cargo.lock

      - name: Report cargo-audit findings
        if: steps.audit.outcome == 'failure'
        run: |
          echo "::warning::cargo-audit reported advisories or a scanner error; review the cargo audit logs."

  mobile:
    name: Expo companion (typecheck, test, export)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run --cwd apps/mobile typecheck
      - name: Test companion transport
        run: bun run --cwd apps/mobile test
      - name: Export the iOS JavaScript bundle
        run: bun run --cwd apps/mobile build
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
