name: CI

on:
  pull_request:
  push:
    branches: ["**"]
  workflow_dispatch:

# No secret-bearing job runs here, so a fork's pull request executes exactly the
# same jobs as a branch build: every step only reads the checked-out sources.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    name: install, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Cache Bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Cache Rust build (sccache)
        uses: actions/cache@v4
        with:
          path: ~/.cache/sccache
          key: sccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: sccache-${{ runner.os }}-

      - name: Cache Tauri CLI
        id: tauri-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/tauri
          key: tauri-cli-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: tauri-cli-${{ runner.os }}-

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            build-essential \
            curl \
            file \
            wget

      - name: Cache cargo sccache
        uses: taiki-e/install-action@v2
        with:
          tool: sccache@0.10.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Stage the sidecar binary and the migrations resource
        run: |
          # Steps 3 and 4 of scripts/build.ts, without the bundle: the Rust job
          # below needs binaries/sidecar-<triple> on disk for `tauri::generate_context!`
          # and the shell expects resources/migrations at runtime.
          bun scripts/build.ts --only=compile,resources --target=x86_64-unknown-linux-gnu

  src-tauri:
    name: src-tauri (clippy, test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Cache Bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Cache Rust build (sccache)
        uses: actions/cache@v4
        with:
          path: ~/.cache/sccache
          key: sccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: sccache-${{ runner.os }}-

      - name: Cache Tauri CLI
        id: tauri-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/tauri
          key: tauri-cli-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: tauri-cli-${{ runner.os }}-

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            build-essential \
            curl \
            file \
            wget

      - name: Cache cargo sccache
        uses: taiki-e/install-action@v2
        with:
          tool: sccache@0.10.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Stage the sidecar binary and the migrations resource
        run: |
          bun scripts/build.ts --only=compile,resources --target=x86_64-unknown-linux-gnu

      - name: cargo fmt
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --all -- --check

      - name: cargo clippy
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        working-directory: apps/desktop/src-tauri
        run: cargo test --all-features
