name: ci-pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Build all desktop assets and publish a release after validation
        type: boolean
        default: false
      bump:
        description: Version bump for a manual release
        type: choice
        default: patch
        options: [patch, minor, major]
      version:
        description: Explicit version override for a manual release
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: ci-pipeline-${{ github.ref }}
  # A release can already be publishing installers when the next push arrives.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate:
    name: validate
    uses: ./.github/workflows/ci.yml

  publish:
    name: prepare release metadata
    needs: validate
    if: >-
      needs.validate.result == 'success' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.release)) &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'nikomatt69/cadcamfun' &&
      !startsWith(github.event.head_commit.message, 'release: v') &&
      !startsWith(github.event.head_commit.message, 'chore: generate') &&
      !startsWith(github.event.head_commit.message, 'chore: update')
    permissions:
      contents: write
      packages: write
      id-token: write
    uses: ./.github/workflows/publish.yml
    with:
      bump: ${{ inputs.bump || 'patch' }}
      version: ${{ inputs.version || '' }}
      prevalidated: true
    secrets: inherit

  desktop:
    name: build all six desktop targets
    needs: publish
    if: needs.publish.result == 'success' && needs.publish.outputs.tag != ''
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.publish.outputs.tag }}
      version: ${{ needs.publish.outputs.version }}
    secrets: inherit

  publish-release:
    name: create and publish the release
    needs: [publish, desktop]
    if: needs.publish.result == 'success' && needs.desktop.result == 'success'
    permissions:
      contents: write
    uses: ./.github/workflows/publish-release.yml
    with:
      tag: ${{ needs.publish.outputs.tag }}
    secrets: inherit
