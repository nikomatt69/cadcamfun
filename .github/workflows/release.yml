name: Release

# The six platform releases of one version. It is called by `publish.yml`, which owns the
# index release (`v6.0.1`) and the updater manifest that points at these releases; it can
# also be dispatched by hand to rebuild an existing tag.
on:
  workflow_call:
    inputs:
      tag:
        description: The v-prefixed version tag to build, e.g. v6.0.1
        required: true
        type: string
      version:
        description: The released version the tag carries
        required: false
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed version tag to build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  trusted:
    if: >-
      github.event.repository.fork != true &&
      (startsWith(inputs.tag, 'v') || startsWith(github.ref_name, 'v'))
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ref.outputs.tag }}
      version: ${{ steps.ref.outputs.version }}
      sha: ${{ steps.ref.outputs.sha }}
      pub_date: ${{ steps.ref.outputs.pub_date }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-bun
        with:
          install: "false"
      - name: Validate release tag and application version
        id: ref
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: bun --no-env-file scripts/release-ref.ts

  # One Linux runner per variant cross-compiles the sidecar with
  # `Bun.build --compile` (scripts/compile-sidecar.ts). No Rust, no Tauri, no
  # signing secrets here — mirroring nikcli `publish.yml`, which cross-builds
  # every CLI variant on a single Ubuntu runner before any desktop build.
  build-sidecars:
    name: sidecar (bun) ${{ matrix.target }}
    needs: trusted
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, slug: macos-arm64 }
          - { target: x86_64-apple-darwin, slug: macos-x64 }
          - { target: x86_64-pc-windows-msvc, slug: windows-x64 }
          - { target: aarch64-pc-windows-msvc, slug: windows-arm64 }
          - { target: x86_64-unknown-linux-gnu, slug: linux-x64 }
          - { target: aarch64-unknown-linux-gnu, slug: linux-arm64 }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.trusted.outputs.sha }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-bun
        with:
          # The build script installs the workspace itself, with the native dependencies
          # of every platform (`--os=* --cpu=*`), so the cross-compile finds them.
          install: "false"
      # `install,compile` only: install pulls every platform's native deps
      # (--os=* --cpu=*) so the cross-compile finds them; compile is the Bun step.
      - name: Cross-compile the sidecar (Bun)
        run: bun --no-env-file scripts/build.ts --only=install,compile --target=${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: sidecar-${{ matrix.target }}
          path: apps/desktop/src-tauri/binaries/sidecar-${{ matrix.target }}*
          if-no-files-found: error

  # Each native runner only places the prebuilt
  # sidecar and bundles with Rust + Tauri CLI (plus WebKit deps on Linux and
  # the platform signing certs). It never recompiles the Bun binary — that is
  # what broke on Windows under nikcli (workspace `bun` bin shim), and why
  # `build` below skips the `compile` step.
  build:
    needs: [trusted, build-sidecars]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            slug: macos-arm64
            bundles: app,dmg
          # Match nikcli: cross-compile Intel macOS on the Apple Silicon runner.
          - os: macos-14
            target: x86_64-apple-darwin
            slug: macos-x64
            bundles: app,dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            slug: windows-x64
            bundles: msi,nsis
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            slug: windows-arm64
            bundles: msi,nsis
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            slug: linux-x64
            bundles: deb,rpm
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            slug: linux-arm64
            bundles: deb,rpm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.trusted.outputs.sha }}
          fetch-depth: 0
      - name: Free Linux runner disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/.ghcup || true
          df -h /
      - uses: ./.github/actions/setup-bun
        with:
          # The build script installs the workspace itself. Windows ARM skips lifecycle
          # scripts: workerd's postinstall rejects win32 arm64.
          install: "false"
      - uses: actions/download-artifact@v4
        with:
          name: sidecar-${{ matrix.target }}
          path: sidecar-incoming
      - name: Place the prebuilt sidecar (built by Bun, not recompiled here)
        shell: bash
        run: |
          set -euo pipefail
          ext=""
          case "${{ matrix.target }}" in *windows*) ext=".exe" ;; esac
          src="$(find sidecar-incoming -type f -name "sidecar-${{ matrix.target }}${ext}" | head -1)"
          if [ -z "$src" ]; then echo "sidecar artifact for ${{ matrix.target }} is missing" >&2; exit 1; fi
          mkdir -p apps/desktop/src-tauri/binaries
          cp "$src" "apps/desktop/src-tauri/binaries/sidecar-${{ matrix.target }}${ext}"
          if [ -z "$ext" ]; then chmod +x "apps/desktop/src-tauri/binaries/sidecar-${{ matrix.target }}"; fi
          ls -l apps/desktop/src-tauri/binaries/
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: cargo-${{ matrix.target }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux bundler dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev build-essential file rpm
      - name: Import Windows signing certificate
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          # The Windows certificate is optional, like nikcli's desktop builds: without it
          # the installer is unsigned and the release notes say so. A certificate that is
          # only half configured is a mistake and fails the build.
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE) -and [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            Write-Output '::warning::No Windows certificate configured; the installer will not be signed'
            exit 0
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) { throw 'The Windows signing certificate is only half configured' }
          $path = Join-Path $env:RUNNER_TEMP 'release-signing.pfx'
          try {
            [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $cert = Import-PfxCertificate -FilePath $path -CertStoreLocation Cert:\CurrentUser\My -Password $password
            if (-not $cert.HasPrivateKey) { throw 'Certificate has no private key' }
            "TAURI_WINDOWS_CERTIFICATE_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV
          } finally { Remove-Item $path -ErrorAction SilentlyContinue }
      - name: Build, sign and index release assets
        env:
          CADCAM_RELEASE: "1"
          RELEASE_TAG: ${{ needs.trusted.outputs.tag }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        # Tauri bundle only: `compile` is skipped — the sidecar was cross-compiled
        # by the Bun job above and already placed in src-tauri/binaries/.
        run: bun --no-env-file scripts/build.ts --skip=check,compile --target=${{ matrix.target }} --bundles=${{ matrix.bundles }} --out-dir=release
      # Tauri's in-app updater consumes an AppImage on Linux. This pipeline matches
      # nikcli and does not build one, so Linux publishes deb and rpm only.
      - name: Build architecture-specific updater manifest
        if: ${{ !contains(matrix.target, 'linux') }}
        env:
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ needs.trusted.outputs.tag }}-${{ matrix.slug }}
          RELEASE_VERSION: ${{ needs.trusted.outputs.version }}
          RELEASE_DATE: ${{ needs.trusted.outputs.pub_date }}
          RELEASE_TARGET: ${{ matrix.target }}
        shell: bash
        run: bun --no-env-file scripts/updater-manifest.ts --collect-dir=release --arch="$RELEASE_TARGET" --version="$RELEASE_VERSION" --release-url="$RELEASE_URL" --pub-date="$RELEASE_DATE" --out=manifest/latest.json
      - uses: actions/upload-artifact@v4
        if: ${{ !contains(matrix.target, 'linux') }}
        with:
          name: manifest-${{ matrix.target }}
          path: manifest/latest.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.target }}
          path: release/
          if-no-files-found: error
      - name: Remove Windows signing certificate
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($env:TAURI_WINDOWS_CERTIFICATE_THUMBPRINT) { Remove-Item "Cert:\CurrentUser\My\$env:TAURI_WINDOWS_CERTIFICATE_THUMBPRINT" -ErrorAction SilentlyContinue }

  manifest:
    needs: [trusted, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.trusted.outputs.sha }}
      - uses: ./.github/actions/setup-bun
        with:
          install: "false"
      - uses: actions/download-artifact@v4
        with:
          pattern: manifest-*
          path: manifests
      - name: Validate and merge updater platforms
        env:
          RELEASE_VERSION: ${{ needs.trusted.outputs.version }}
        run: bun --no-env-file scripts/updater-manifest.ts --merge=manifests --out=latest.json --version="$RELEASE_VERSION" --expected-platforms=darwin-aarch64,darwin-x86_64,windows-aarch64,windows-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: latest-json
          path: latest.json
          if-no-files-found: error

  publish-platform:
    name: release ${{ matrix.slug }}
    needs: [trusted, build, manifest]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, slug: macos-arm64, label: macOS (Apple Silicon) }
          - { target: x86_64-apple-darwin, slug: macos-x64, label: macOS (Intel) }
          - { target: x86_64-pc-windows-msvc, slug: windows-x64, label: Windows (x64) }
          - { target: aarch64-pc-windows-msvc, slug: windows-arm64, label: Windows (ARM64) }
          - { target: x86_64-unknown-linux-gnu, slug: linux-x64, label: Linux (x64) }
          - { target: aarch64-unknown-linux-gnu, slug: linux-arm64, label: Linux (ARM64) }
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PLATFORM_TAG: ${{ needs.trusted.outputs.tag }}-${{ matrix.slug }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.trusted.outputs.sha }}
      - uses: ./.github/actions/setup-bun
        with:
          install: "false"
      - uses: actions/download-artifact@v4
        with:
          name: installers-${{ matrix.target }}
          path: installers
      - uses: actions/download-artifact@v4
        if: ${{ !contains(matrix.target, 'linux') }}
        with:
          name: manifest-${{ matrix.target }}
          path: manifest
      - name: Verify checksums, signatures and manifest links; stage this platform's release
        env:
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ needs.trusted.outputs.tag }}-${{ matrix.slug }}
        shell: bash
        run: |
          if [ -f manifest/latest.json ]; then
            bun --no-env-file scripts/stage-release.ts --mode=platform --installers=installers --manifest=manifest/latest.json --out=dist --release-url="$RELEASE_URL"
          else
            bun --no-env-file scripts/stage-release.ts --mode=installers --installers=installers --out=dist
          fi
      - name: Refuse to modify an already published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$PLATFORM_TAG" --json isDraft > existing-release.json 2> /dev/null; then
            jq -e '.isDraft == true' existing-release.json > /dev/null || { echo "Release $PLATFORM_TAG is already published" >&2; exit 1; }
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.PLATFORM_TAG }}
          target_commitish: ${{ needs.trusted.outputs.sha }}
          name: CADCAM FUN ${{ needs.trusted.outputs.tag }} for ${{ matrix.label }}
          draft: false
          prerelease: ${{ contains(needs.trusted.outputs.version, '-') }}
          # Only the index release may be "latest": the updater reads latest.json from it.
          make_latest: "false"
          body_path: dist/RELEASE_NOTES.md
          files: dist/*
          fail_on_unmatched_files: true

  # The index release (`v6.0.1`) and the npm package are published by `publish.yml`, which
  # owns the release as a whole: it creates the index release as a draft, calls this
  # workflow for the six platform releases, and only makes the index release public once
  # the updater manifest is attached to it.

