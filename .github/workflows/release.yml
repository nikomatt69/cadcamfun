name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed version tag to build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  BUN_VERSION: "1.4.2"

jobs:
  trusted:
    if: >-
      github.event.repository.fork == false &&
      ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
       (github.event_name == 'workflow_dispatch' && startsWith(inputs.tag, 'v')))
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ref.outputs.tag }}
      version: ${{ steps.ref.outputs.version }}
      sha: ${{ steps.ref.outputs.sha }}
      pub_date: ${{ steps.ref.outputs.pub_date }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Validate release tag and application version
        id: ref
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: bun --no-env-file scripts/release-ref.ts

  build:
    needs: trusted
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            slug: macos-arm64
            bundles: app,dmg
          # Match nikcli: cross-compile Intel macOS on the Apple Silicon runner.
          - os: macos-14
            target: x86_64-apple-darwin
            slug: macos-x64
            bundles: app,dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            slug: windows-x64
            bundles: msi,nsis
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            slug: windows-arm64
            bundles: msi,nsis
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            slug: linux-x64
            bundles: deb,rpm,appimage
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            slug: linux-arm64
            bundles: deb,rpm,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.trusted.outputs.sha }}
          fetch-depth: 0
      - name: Free Linux runner disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/.ghcup || true
          df -h /
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: cargo-${{ matrix.target }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux bundler dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2 libssl-dev build-essential file rpm
      - name: Import Windows signing certificate
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) { throw 'Windows signing certificate and password are required' }
          $path = Join-Path $env:RUNNER_TEMP 'release-signing.pfx'
          try {
            [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $cert = Import-PfxCertificate -FilePath $path -CertStoreLocation Cert:\CurrentUser\My -Password $password
            if (-not $cert.HasPrivateKey) { throw 'Certificate has no private key' }
            "TAURI_WINDOWS_CERTIFICATE_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV
          } finally { Remove-Item $path -ErrorAction SilentlyContinue }
      - name: Build, sign and index release assets
        env:
          CADCAM_RELEASE: "1"
          RELEASE_TAG: ${{ needs.trusted.outputs.tag }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun --no-env-file scripts/build.ts --target=${{ matrix.target }} --bundles=${{ matrix.bundles }} --out-dir=release
      - name: Build architecture-specific updater manifest
        env:
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ needs.trusted.outputs.tag }}-${{ matrix.slug }}
          RELEASE_VERSION: ${{ needs.trusted.outputs.version }}
          RELEASE_DATE: ${{ needs.trusted.outputs.pub_date }}
          RELEASE_TARGET: ${{ matrix.target }}
        shell: bash
        run: bun --no-env-file scripts/updater-manifest.ts --collect-dir=release --arch="$RELEASE_TARGET" --version="$RELEASE_VERSION" --release-url="$RELEASE_URL" --pub-date="$RELEASE_DATE" --out=manifest/latest.json
      - uses: actions/upload-artifact@v4
        with:
          name: manifest-${{ matrix.target }}
          path: manifest/latest.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.target }}
          path: release/
          if-no-files-found: error
      - name: Remove Windows signing certificate
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($env:TAURI_WINDOWS_CERTIFICATE_THUMBPRINT) { Remove-Item "Cert:\CurrentUser\My\$env:TAURI_WINDOWS_CERTIFICATE_THUMBPRINT" -ErrorAction SilentlyContinue }

  manifest:
    needs: [trusted, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.trusted.outputs.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          pattern: manifest-*
          path: manifests
      - name: Validate and merge all six updater platforms
        env:
          RELEASE_VERSION: ${{ needs.trusted.outputs.version }}
        run: bun --no-env-file scripts/updater-manifest.ts --merge=manifests --out=latest.json --version="$RELEASE_VERSION" --expected-platforms=darwin-aarch64,darwin-x86_64,windows-aarch64,windows-x86_64,linux-aarch64,linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: latest-json
          path: latest.json
          if-no-files-found: error

  publish-platform:
    name: release ${{ matrix.slug }}
    needs: [trusted, build, manifest]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, slug: macos-arm64, label: macOS (Apple Silicon) }
          - { target: x86_64-apple-darwin, slug: macos-x64, label: macOS (Intel) }
          - { target: x86_64-pc-windows-msvc, slug: windows-x64, label: Windows (x64) }
          - { target: aarch64-pc-windows-msvc, slug: windows-arm64, label: Windows (ARM64) }
          - { target: x86_64-unknown-linux-gnu, slug: linux-x64, label: Linux (x64) }
          - { target: aarch64-unknown-linux-gnu, slug: linux-arm64, label: Linux (ARM64) }
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PLATFORM_TAG: ${{ needs.trusted.outputs.tag }}-${{ matrix.slug }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.trusted.outputs.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: installers-${{ matrix.target }}
          path: installers
      - uses: actions/download-artifact@v4
        with:
          name: manifest-${{ matrix.target }}
          path: manifest
      - name: Verify checksums, signatures and manifest links; stage this platform's release
        env:
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ needs.trusted.outputs.tag }}-${{ matrix.slug }}
        run: bun --no-env-file scripts/stage-release.ts --mode=platform --installers=installers --manifest=manifest/latest.json --out=dist --release-url="$RELEASE_URL"
      - name: Refuse to modify an already published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$PLATFORM_TAG" --json isDraft > existing-release.json 2> /dev/null; then
            jq -e '.isDraft == true' existing-release.json > /dev/null || { echo "Release $PLATFORM_TAG is already published" >&2; exit 1; }
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.PLATFORM_TAG }}
          target_commitish: ${{ needs.trusted.outputs.sha }}
          name: CADCAM FUN ${{ needs.trusted.outputs.tag }} for ${{ matrix.label }}
          draft: false
          prerelease: ${{ contains(needs.trusted.outputs.version, '-') }}
          # Only the index release below may be "latest": the updater reads latest.json from it.
          make_latest: "false"
          body_path: dist/RELEASE_NOTES.md
          files: dist/*
          fail_on_unmatched_files: true

  # Published last, and only when all six platform releases are out: the updater manifest it carries then never points at a
  # missing installer.
  publish-index:
    needs: [trusted, manifest, publish-platform]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.trusted.outputs.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: latest-json
          path: manifest
      - name: Verify the manifest points into the six platform releases; stage the index release
        env:
          DOWNLOAD_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download
          RELEASE_TAG: ${{ needs.trusted.outputs.tag }}
        run: bun --no-env-file scripts/stage-release.ts --mode=index --manifest=manifest/latest.json --out=dist --download-url="$DOWNLOAD_URL" --tag="$RELEASE_TAG"
      - name: Refuse to modify an already published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.trusted.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > existing-release.json 2> /dev/null; then
            jq -e '.isDraft == true' existing-release.json > /dev/null || { echo "Release $RELEASE_TAG is already published" >&2; exit 1; }
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.trusted.outputs.tag }}
          target_commitish: ${{ needs.trusted.outputs.sha }}
          name: CADCAM FUN ${{ needs.trusted.outputs.tag }}
          draft: false
          prerelease: ${{ contains(needs.trusted.outputs.version, '-') }}
          make_latest: ${{ contains(needs.trusted.outputs.version, '-') && 'false' || 'true' }}
          body_path: dist/RELEASE_NOTES.md
          files: dist/*
          fail_on_unmatched_files: true

  # Needs the repository secret NPM_TOKEN (an npm automation token that can publish under the @nikoemme scope). Without it
  # the job warns and stays green; a version already on the registry is skipped, so re-running a release is safe.
  publish-npm:
    needs: trusted
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.trusted.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Publish @nikoemme/cadcamfun-nikcli-plugin
        working-directory: packages/nikcli-plugin
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::warning::NPM_TOKEN is not set; skipping the npm publish"
            exit 0
          fi
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version > /dev/null 2>&1; then
            echo "$name@$version is already on npm; nothing to publish"
            exit 0
          fi
          case "$version" in *-*) channel=next ;; *) channel=latest ;; esac
          npm publish --access public --tag "$channel"
